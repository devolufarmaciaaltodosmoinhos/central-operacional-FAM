[build]
  publish = "."
  command = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API do estado partilhado (Netlify Blobs) — ver netlify/functions/data.js
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

# ---------------------------------------------------------------------------
# Cabeçalhos — desempenho e segurança
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Zero dependências de terceiros (sem CDN de fontes/ícones) -> CSP estrito.
    # connect-src 'self' cobre também /api/data (mesma origem).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# HTML — nunca em cache agressiva (garante que a próxima visita vê a versão mais recente)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Módulos JS e CSS — cache curta com revalidação (sem hashes de build, por isso
# não usamos "immutable"; ainda assim evita novos pedidos em navegação repetida
# dentro da mesma sessão, e o Service Worker trata o cache entre sessões).
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A API nunca deve ser guardada em cache (tem de refletir sempre o estado atual).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# ---------------------------------------------------------------------------
# Compressão: o Netlify aplica Brotli/Gzip automaticamente a todos os assets
# de texto (html, css, js, json, svg) — nada a configurar aqui.
# ---------------------------------------------------------------------------
